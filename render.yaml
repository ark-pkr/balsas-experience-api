services:
  - type: web
    name: balsas-experience-api
    runtime: node
    plan: free
    repo: https://github.com/ark-pkr/balsas-experience-api
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.13.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
